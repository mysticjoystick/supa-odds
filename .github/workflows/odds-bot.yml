name: Refresh odds snapshot

# Keeps public/snapshot.json fresh so the live site never goes stale.
# No API key needed (free ESPN hybrid feed). Add an ODDS_API_KEY repo
# secret anytime for full multi-book prices — the bot picks it up.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch latest odds
        run: node bot/fetchOdds.js
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: Commit snapshot if changed
        run: |
          git config user.name "supa-odds-bot"
          git config user.email "supa-odds-bot@users.noreply.github.com"
          git add public/snapshot.json
          git diff --cached --quiet || git commit -m "chore: refresh odds snapshot"
          git push
